<div class="wrap">
  <div class="top">
    <div>
      <h1>Murano Sell-Thru Tracker</h1>
      <div class="sub" id="subline">Weekly sell-thru and stock on hand by brand and outlet</div>
    </div>

    </div>
  </section>

  <div id="main"></div>
</div>

<script>
(function(){
'use strict';
var S={all:[],brand:null,wantBrand:null,view:'dash',b:{metric:'soh',group:'outlet',type:'column',top:'10',order:'desc'},weeks:[],sel:null,outlet:null,heat:'soh',sortKey:'soh',sortDir:-1,skuSort:'soh',skuDir:-1,db:null,col:null,staged:[],confirmDel:null,loaded:false};
var $=function(s){return document.querySelector(s)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-US')}
function f1(n){return n==null||!isFinite(n)?'–':n.toFixed(1)}
function pct(n){return n==null||!isFinite(n)?'–':(n*100).toFixed(1)+'%'}
function short(d){var s=String(d||'');brands().forEach(function(b){s=s.replace(new RegExp('^'+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s+','i'),'')});return s.replace(/^PanzerGlass\s+/i,'').replace(/\b[A-Z]{2,5}-[A-Z0-9]{4,}\s+/,'')}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},4200)}
function wlabel(w){return 'Wk '+w.week}

/* ---------- brands & storage ---------- */
function norm(w){w.brand=(w.brand&&String(w.brand).trim())||'PANZERGLASS';return w}
function wkey(w){return w.brand+'|'+w.id}
function docId(w){return w.brand.replace(/[^A-Za-z0-9]+/g,'-')+'_'+w.id}
function byId(a,b){return a.id<b.id?-1:a.id>b.id?1:(a.brand<b.brand?-1:a.brand>b.brand?1:0)}
function brands(){var b=[];S.all.forEach(function(w){if(b.indexOf(w.brand)<0)b.push(w.brand)});return b.sort()}
function dedupe(list){var m={},out=[];list.forEach(function(w){m[wkey(w)]=w});Object.keys(m).forEach(function(k){out.push(m[k])});return out}
function mergeWeeks(list){
  var outs=[];list.forEach(function(w){w.outlets.forEach(function(o){if(outs.indexOf(o)<0)outs.push(o)})});
  var ids=[],descs=[],bs=[],soh=[],st=[],O=outs.length;
  list.forEach(function(w){var wo=w.outlets.length,map=outs.map(function(o){return w.outlets.indexOf(o)});
    for(var s=0;s<w.skuIds.length;s++){ids.push(w.skuIds[s]);descs.push(w.skuDescs[s]);bs.push(w.brand);
      for(var j=0;j<O;j++){var oi=map[j];soh.push(oi<0?0:(w.soh[s*wo+oi]||0));st.push(oi<0?0:(w.st[s*wo+oi]||0))}}});
  return{id:list[0].id,year:list[0].year,week:list[0].week,executed:list[list.length-1].executed,brand:'ALL',nb:list.length,outlets:outs,skuIds:ids,skuDescs:descs,skuBrands:bs,soh:soh,st:st}
}
function derive(){
  S.all.sort(byId);
  var bl=brands();
  if(S.wantBrand&&bl.indexOf(S.wantBrand)>=0){S.brand=S.wantBrand;S.wantBrand=null}
  if(!S.brand||(S.brand!=='ALL'&&bl.indexOf(S.brand)<0)||(S.brand==='ALL'&&bl.length<2))S.brand=bl.length>1?'ALL':(bl[0]||null);
  var ws;
  if(S.brand==='ALL'){var g={},order=[];S.all.forEach(function(w){if(!g[w.id]){g[w.id]=[];order.push(w.id)}g[w.id].push(w)});ws=order.map(function(k){return mergeWeeks(g[k])})}
  else ws=S.all.filter(function(w){return w.brand===S.brand});
  S.weeks=ws;
  if(!S.sel||!ws.some(function(w){return w.id===S.sel})){
    var full=S.brand==='ALL'?ws.filter(function(w){return w.nb>=bl.length}):ws;
    var pick=full.length?full:ws;S.sel=pick.length?pick[pick.length-1].id:null}
}

function withWeeks(list,fn){var keep=S.weeks;S.weeks=list;try{return fn()}finally{S.weeks=keep}}
/*LS-START*/
var SEED=[];
function lsGet(){
  var base=SEED.slice(),loc={w:[],r:[]};
  try{var v=localStorage.getItem('pg-local');if(v)loc=JSON.parse(v)}catch(e){}
  base=base.filter(function(w){return(loc.r||[]).indexOf(wkey(w))<0});
  (loc.w||[]).forEach(function(w){norm(w);var i=base.findIndex(function(x){return wkey(x)===wkey(w)});if(i>=0)base[i]=w;else base.push(w)});
  return base
}
function lsSet(){
  try{var sid={};SEED.forEach(function(w){sid[wkey(w)]=JSON.stringify(w)});
    var w=S.all.filter(function(x){return sid[wkey(x)]!==JSON.stringify(x)}),r=SEED.filter(function(x){return!S.all.some(function(y){return wkey(y)===wkey(x)})}).map(wkey);
    localStorage.setItem('pg-local',JSON.stringify({w:w,r:r}))}catch(e){}
}
/*LS-END*/
function saveWeek(w){
  norm(w);
  if(S.col){return S.col.doc(docId(w)).set(w)}
  var i=S.all.findIndex(function(x){return wkey(x)===wkey(w)});if(i>=0)S.all[i]=w;else S.all.push(w);derive();lsSet();return Promise.resolve()
}
function removeWeek(k){
  var w=S.all.find(function(x){return wkey(x)===k});if(!w)return Promise.resolve();
  if(S.col){return S.col.doc(docId(w)).delete()}
  S.all=S.all.filter(function(x){return wkey(x)!==k});derive();lsSet();return Promise.resolve()
}

/* ---------- metrics ---------- */
function W(id){return S.weeks.find(function(w){return w.id===id})}
function scope(w){ /* returns per-sku and per-outlet aggregates for the active outlet filter */
  var O=w.outlets.length,K=w.skuIds.length,oi=S.outlet?w.outlets.indexOf(S.outlet):-1;
  return{O:O,K:K,oi:oi};
}
function totals(w,outlet){
  var O=w.outlets.length,K=w.skuIds.length,soh=0,st=0,so=0,oi=outlet?w.outlets.indexOf(outlet):-1;
  if(outlet&&oi<0)return null;
  for(var s=0;s<K;s++)for(var o=0;o<O;o++){if(oi>=0&&o!==oi)continue;var a=w.soh[s*O+o]||0;soh+=a;st+=w.st[s*O+o]||0;if(a===0)so++}
  return{soh:soh,st:st,so:so,rate:(soh+st)?st/(soh+st):null}
}
function cover(id,outlet){ /* weeks of cover = SOH / average weekly sell-thru, last up to 4 weeks ending at id */
  var idx=S.weeks.findIndex(function(w){return w.id===id});if(idx<0)return null;
  var from=Math.max(0,idx-3),sum=0,n=0;
  for(var i=from;i<=idx;i++){var t=totals(S.weeks[i],outlet);if(t){sum+=t.st;n++}}
  var cur=totals(S.weeks[idx],outlet);if(!cur||!n||sum===0)return null;
  return cur.soh/(sum/n)
}
function delta(a,b,mode,neutral){
  if(a==null||b==null)return'';
  var d=a-b;if(Math.abs(d)<1e-9)return'<span>no change</span> vs prior week';
  var cls=neutral?'':(d>0?'up':'down');var arrow=d>0?'▲':'▼';
  var txt=mode==='pct'?Math.abs(d*100).toFixed(1)+' pts':mode==='dec'?Math.abs(d).toFixed(1):fmt(Math.abs(d));
  return'<span class="'+cls+'">'+arrow+' '+txt+'</span> vs prior week'
}

var tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';var x=e.clientX+12,y=e.clientY-34;if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-12;tip.style.left=x+'px';tip.style.top=Math.max(4,y)+'px'}
function hideTip(){tip.style.display='none'}
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;var n=m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10;return n*p}
function chart(host,o){
  var w=Math.max(260,host.clientWidth||320),h=200,L=40,R=12,T=18,B=26,iw=w-L-R,ih=h-T-B,n=o.labels.length;
  var vals=o.values,max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),y0,y1;
  if(o.kind==='bar'){y0=0;y1=niceMax(max*1.1)}
  else{var span=Math.max(max-min,max*0.04,4);y0=Math.max(0,Math.floor((min-span*.6)/10)*10);y1=Math.ceil((max+span*.6)/10)*10;if(y1<=y0)y1=y0+10}
  var X=function(i){return L+(n===1?iw/2:iw*(i+.5)/n)},Y=function(v){return T+ih-(v-y0)/(y1-y0)*ih};
  var s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.title)+'">';
  for(var k=0;k<=4;k++){var tv=y0+(y1-y0)*k/4,ty=Y(tv);s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+ty+'" y2="'+ty+'" stroke="var(--line-soft)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(ty+4)+'" text-anchor="end">'+(Math.abs(tv)>=10?Math.round(tv):tv.toFixed(1))+'</text>'}
  var bw=Math.min(46,iw/n*.55),i;
  if(o.kind==='bar'){
    for(i=0;i<n;i++){var v=vals[i],x=X(i)-bw/2,yy=Y(v),hh=Math.max(0,T+ih-yy),r=Math.min(4,hh,bw/2);
      s+='<path d="M'+x+' '+(T+ih)+'V'+(yy+r)+'Q'+x+' '+yy+' '+(x+r)+' '+yy+'H'+(x+bw-r)+'Q'+(x+bw)+' '+yy+' '+(x+bw)+' '+(yy+r)+'V'+(T+ih)+'Z" fill="'+o.color+'" opacity="'+(i===o.selIdx?1:.55)+'"/>'}
  }else{
    var d='';for(i=0;i<n;i++)d+=(i?'L':'M')+X(i)+' '+Y(vals[i]);
    s+='<path d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    for(i=0;i<n;i++){var sel=i===o.selIdx;s+='<circle cx="'+X(i)+'" cy="'+Y(vals[i])+'" r="'+(sel?5:3.5)+'" fill="'+(sel?o.color:'var(--surface)')+'" stroke="'+o.color+'" stroke-width="2"/>'}
  }
  var every=n>8?Math.ceil(n/8):1;
  for(i=0;i<n;i++){
    if(i%every===0||i===o.selIdx)s+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>';
    if(n<=8||i===o.selIdx)s+='<text class="val" x="'+X(i)+'" y="'+(Y(vals[i])-8)+'" text-anchor="middle">'+(o.f||fmt)(vals[i])+'</text>';
    s+='<rect data-i="'+i+'" x="'+(X(i)-iw/n/2)+'" y="'+T+'" width="'+(iw/n)+'" height="'+ih+'" fill="transparent"/>'
  }
  host.innerHTML=s+'</svg>';
  host.querySelectorAll('rect[data-i]').forEach(function(r){
    var i=+r.getAttribute('data-i');
    r.addEventListener('mousemove',function(e){showTip(e,'<b>'+esc(o.labels[i])+'</b> · '+esc(o.name)+' '+(o.f||fmt)(vals[i])+(o.extra?o.extra[i]:''))});
    r.addEventListener('mouseleave',hideTip);
    r.addEventListener('click',function(){S.sel=o.ids[i];render()})
  })
}
function spark(vals,color){
  var w=84,h=24,n=vals.length,max=Math.max.apply(null,vals.concat([1]));
  if(n<2)return'<span class="sub">–</span>';
  var bw=Math.max(3,(w-(n-1)*3)/n),s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">';
  for(var i=0;i<n;i++){var bh=Math.max(1.5,vals[i]/max*(h-2));s+='<rect x="'+(i*(bw+3))+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="1.5" fill="'+color+'" opacity="'+(i===n-1?1:.5)+'"/>'}
  return s+'</svg>'
}

function weekTable(){
  var multi=brands().length>1;

var PAL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

function agg(w,o,sid){
  var O=w.outlets.length,K=w.skuIds.length,oi=o?w.outlets.indexOf(o):-1,si=sid?w.skuIds.indexOf(sid):-1;
  if((o&&oi<0)||(sid&&si<0))return null;
  var soh=0,st=0,so=0;
  for(var s=0;s<K;s++){if(si>=0&&s!==si)continue;for(var x=0;x<O;x++){if(oi>=0&&x!==oi)continue;var a=w.soh[s*O+x]||0;soh+=a;st+=w.st[s*O+x]||0;if(!a)so++}}
  return{soh:soh,st:st,so:so,rate:(soh+st)?st/(soh+st):null}
}
function coverG(id,o,sid){
  var idx=S.weeks.findIndex(function(w){return w.id===id});if(idx<0)return null;
  var sum=0,n=0;for(var i=Math.max(0,idx-3);i<=idx;i++){var a=agg(S.weeks[i],o,sid);if(a){sum+=a.st;n++}}
  var c=agg(S.weeks[idx],o,sid);if(!c||!n||!sum)return null;return c.soh/(sum/n)
}

  var info=wb.Sheets['Information'],txt='';

  var m=txt.match(/YWD:\s*(\d{2,4})\s*Wk\s*(\d{1,2})/i)||txt.match(/(\d{2,4})\s*Wk\s*(\d{1,2})/i);
  if(!m){out.errors.push('Could not find the week on the Information sheet (expected “Date.Calendar YWD: 26 Wk 39”).');return out}
  var yr=+m[1];if(yr<100)yr+=2000;var wk=+m[2];
  var bm=txt.match(/Brand Name:\s*([^;]+)/i),brand=bm?bm[1].trim():'';if(!brand){out.warns.push('Brand name not found in the file. Type it in the Brand box below.');brand='UNKNOWN'}
  var ex=txt.match(/Executed on:\s*(.*?)(?:\s{2,}|$)/);var exm=txt.match(/(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),[^+]*\(\+\d\d:\d\d\)/);
  var ws=null,rows=null,hi=-1;
  for(var si=0;si<wb.SheetNames.length&&hi<0;si++){
    var r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,defval:null,blankrows:true});
    for(var i=0;i<Math.min(r.length,12);i++){if(r[i]&&String(r[i][1]).trim()==='Item ID'){hi=i;rows=r;break}}
  }
  if(hi<0){out.errors.push('Could not find the data table (a header row with “Item ID”).');return out}
  var hdr=rows[hi],sub=rows[hi+1]||[],outlets=[],cols=[],sohOff=[];
  var kind=function(v){v=String(v==null?'':v).trim().toLowerCase();return v==='soh'?'soh':(v==='sell-thru'||v==='sell thru'||v==='sellthru'?'st':'')};
  var totCol=-1;
  for(var c0=0;c0<hdr.length;c0++){if(String(hdr[c0]).trim().toLowerCase()==='total'){totCol=c0;break}}
  var tSoh=-1,tSt=-1;
  if(totCol>=0){if(kind(sub[totCol])==='soh'&&kind(sub[totCol+1])==='st'){tSoh=totCol;tSt=totCol+1}else if(kind(sub[totCol])==='st'&&kind(sub[totCol+1])==='soh'){tSt=totCol;tSoh=totCol+1}}
  var skip=totCol>=0?totCol+2:3;
  for(var c=skip;c<hdr.length;c++){if(hdr[c]!=null&&String(hdr[c]).trim()!==''){
    var k1=kind(sub[c]),k2=kind(sub[c+1]);
    if(!((k1==='soh'&&k2==='st')||(k1==='st'&&k2==='soh'))){out.errors.push('Outlet “'+hdr[c]+'” needs one SOH column and one Sell-Thru column side by side under it.');return out}
    outlets.push(String(hdr[c]).trim());cols.push(c);sohOff.push(k1==='soh'?0:1)}}
  if(!outlets.length){out.errors.push('No outlet columns found.');return out}
  var ids=[],descs=[],soh=[],st=[],tot=null,num=function(v){return typeof v==='number'?v:(v==null||v===''?0:(isNaN(+v)?0:+v))};
  var O=outlets.length,keep=0;
  for(var r2=hi+2;r2<rows.length;r2++){var row=rows[r2]||[];
    if(String(row[0]).trim()==='Total'){if(tSoh>=0)tot={soh:num(row[tSoh]),st:num(row[tSt])};break}
    if(row[1]==null||String(row[1]).trim()==='')continue;
    ids.push(String(row[1]).trim());descs.push(String(row[2]||'').trim());
    for(var o=0;o<O;o++){soh.push(num(row[cols[o]+sohOff[o]]));st.push(num(row[cols[o]+1-sohOff[o]]))}
  }
  if(!ids.length){out.errors.push('No SKU rows found under the header.');return out}
  var ssoh=soh.reduce(function(a,b){return a+b},0),sst=st.reduce(function(a,b){return a+b},0);
  if(tot&&(tot.soh!==ssoh||tot.st!==sst))out.warns.push('Outlet columns add up to '+ssoh+' on hand / '+sst+' sold, but the file’s Total row says '+tot.soh+' / '+tot.st+'.');
  out.week={id:yr+'-W'+(wk<10?'0':'')+wk,year:yr,week:wk,brand:brand,executed:exm?exm[0]:(ex?ex[1]:''),outlets:outlets,skuIds:ids,skuDescs:descs,soh:soh,st:st,source:fname};
  return out
}
function handleFiles(files){
  files=Array.prototype.slice.call(files);if(!files.length)return;
  if(typeof XLSX==='undefined'){toast('The Excel reader (xlsx.full.min.js) did not load. Make sure that file is in the repo root next to index.html.');return}
  var done=[],pending=files.length;
  files.forEach(function(f,i){
    var rd=new FileReader();
    rd.onload=function(e){var r;try{r=parseWorkbook(XLSX.read(e.target.result,{type:'array'}),f.name)}catch(err){r={file:f.name,errors:['Could not read this file as Excel ('+(err&&err.message||err)+').'],warns:[]}}
      done[i]=r;if(--pending===0)stage(done)};
    rd.onerror=function(){done[i]={file:f.name,errors:['Could not read the file.'],warns:[]};if(--pending===0)stage(done)};
    rd.readAsArrayBuffer(f)
  })
}
function evalStage(){
  var seen={};
  S.staged.forEach(function(r){if(!r.week)return;r.skip=false;if(!r.pw)r.pw=r.warns.slice();r.warns=r.pw.slice();
    var k=wkey(r.week);if(seen[k]){seen[k].warns.push('Another file in this batch has the same brand and week and takes its place.');seen[k].skip=true}seen[k]=r});
  S.staged.forEach(function(r){if(!r.week)return;
    var ex=S.all.find(function(x){return wkey(x)===wkey(r.week)});r.replace=!!ex;
    var mine=S.all.filter(function(x){return x.brand===r.week.brand});
    var ref=ex||mine.filter(function(w){return w.id<r.week.id}).pop()||mine[0];
    if(!mine.length&&S.all.length)r.warns.push('New brand: '+r.week.brand+'.');
    if(ref){var a=ref.outlets.filter(function(o){return r.week.outlets.indexOf(o)<0}),b=r.week.outlets.filter(function(o){return ref.outlets.indexOf(o)<0});
      if(a.length)r.warns.push('Outlets missing vs '+(ex?'the existing week':'the previous week')+': '+a.join(', ')+'.');
      if(b.length)r.warns.push('New outlets: '+b.join(', ')+'.')}})
}

    if(r.errors.length)return'<div class="imp-row bad"><div><b>'+esc(r.file)+'</b><div class="warn" style="color:var(--crit)">'+esc(r.errors.join(' '))+'</div></div><span class="pill crit">Skipped</span></div>';

      '<div class="meta" style="margin-top:4px"><label>Brand <input type="text" class="bin" data-bi="'+i+'" list="brandList" value="'+esc(w.brand)+'" id="bin'+i+'" style="border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 6px;width:160px"></label></div>'+
      r.warns.map(function(x){return'<div class="warn">'+esc(x)+'</div>'}).join('')+'</div><span class="pill '+(r.skip?'none':r.replace?'warn':'ok')+'">'+(r.skip?'Not used':r.replace?'Replaces existing week':'New week')+'</span></div>'}).join('');

function bindDrop(el){

  ['dragenter','dragover'].forEach(function(n){el.addEventListener(n,function(e){e.preventDefault();el.classList.add('over')})});

function buildWorkbook(list){
  var wb=XLSX.utils.book_new(),bl=[],keys=[];
  list.forEach(function(w){if(bl.indexOf(w.brand)<0)bl.push(w.brand)});bl.sort();
  list.forEach(function(w){if(keys.indexOf(w.id)<0)keys.push(w.id)});keys.sort();
  var lab=function(k){return k.replace('-W',' Wk ')};
  var byBrand=function(b){return list.filter(function(x){return x.brand===b})};
  var long=[['Brand','Year','Week','Outlet','Item ID','Item Desc','SOH','Sell-Thru']];
  bl.forEach(function(b){byBrand(b).forEach(function(w){var O=w.outlets.length;for(var s=0;s<w.skuIds.length;s++)for(var o=0;o<O;o++)long.push([b,w.year,w.week,w.outlets[o],w.skuIds[s],w.skuDescs[s],w.soh[s*O+o]||0,w.st[s*O+o]||0])})});
  var wsd=XLSX.utils.aoa_to_sheet(long);wsd['!cols']=[{wch:14},{wch:6},{wch:6},{wch:8},{wch:16},{wch:58},{wch:8},{wch:10}];wsd['!autofilter']={ref:'A1:H'+long.length};
  var sum=[['Brand','Year','Week','SOH','Sell-Thru','Sell-Thru rate','Weeks of cover']];
  var addSum=function(name,list){withWeeks(list,function(){list.forEach(function(w){var t=totals(w,null),c=cover(w.id,null);sum.push([name,w.year,w.week,t.soh,t.st,t.rate==null?null:+t.rate.toFixed(4),c==null?null:+c.toFixed(2)])})})};
  bl.forEach(function(b){addSum(b,byBrand(b))});
  if(bl.length>1){var g={};list.forEach(function(w){(g[w.id]=g[w.id]||[]).push(w)});addSum('All brands',keys.map(function(k){return mergeWeeks(g[k])}))}
  var wss=XLSX.utils.aoa_to_sheet(sum);wss['!cols']=[{wch:14},{wch:6},{wch:6},{wch:8},{wch:10},{wch:14},{wch:14}];
  var oh=['Brand','Outlet'];keys.forEach(function(k){oh.push(lab(k)+' SOH',lab(k)+' Sell-Thru')});
  var ob=[oh],kh=['Brand','Item ID','Item Desc'];keys.forEach(function(k){kh.push(lab(k)+' SOH',lab(k)+' Sell-Thru')});var kb=[kh];
  bl.forEach(function(b){var ws=byBrand(b),outs=[],skus=[],desc={};
    ws.forEach(function(w){w.outlets.forEach(function(o){if(outs.indexOf(o)<0)outs.push(o)});w.skuIds.forEach(function(id,i){if(!desc[id]){desc[id]=w.skuDescs[i];skus.push(id)}})});
    outs.forEach(function(o){var r=[b,o];keys.forEach(function(k){var w=ws.find(function(x){return x.id===k}),t=w?totals(w,o):null;r.push(t?t.soh:null,t?t.st:null)});ob.push(r)});
    skus.forEach(function(id){var r=[b,id,desc[id]];keys.forEach(function(k){var w=ws.find(function(x){return x.id===k}),si=w?w.skuIds.indexOf(id):-1;if(si<0){r.push(null,null);return}var O=w.outlets.length,a=0,c=0;for(var o=0;o<O;o++){a+=w.soh[si*O+o]||0;c+=w.st[si*O+o]||0}r.push(a,c)});kb.push(r)})});
  var wso=XLSX.utils.aoa_to_sheet(ob);wso['!cols']=[{wch:14},{wch:10}];
  var wsk=XLSX.utils.aoa_to_sheet(kb);wsk['!cols']=[{wch:14},{wch:16},{wch:58}];
  XLSX.utils.book_append_sheet(wb,wsd,'All data');XLSX.utils.book_append_sheet(wb,wss,'Weekly totals');XLSX.utils.book_append_sheet(wb,wso,'By outlet');XLSX.utils.book_append_sheet(wb,wsk,'By SKU');
  return wb
}

  var sc=d.querySelector('.exbd');var top=sc?sc.scrollTop:0;
  d.innerHTML=h;var sc2=d.querySelector('.exbd');if(sc2)sc2.scrollTop=top

function runExport(){
  var lst=exList();if(!lst.length)return;
  var bs=[],ks=[];lst.forEach(function(w){if(bs.indexOf(w.brand)<0)bs.push(w.brand);if(ks.indexOf(w.id)<0)ks.push(w.id)});bs.sort();ks.sort();
  var allB=brands().length===bs.length;
  var bn=allB?'AllBrands':(bs.length<=2?bs.join('-'):bs.length+'Brands');
